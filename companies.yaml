# Companies whose careers pages are read directly.
# ats: greenhouse | lever | ashby | personio | smartrecruiters | recruitee | workable
#      join | workday | eightfold | page
# id:  the board name in their careers URL, e.g. jobs.lever.co/<id>
#      workday: the full careers URL (https://<tenant>.wdN.myworkdayjobs.com/<site>)
#      page:    a plain careers page URL; links one level below it count as jobs
#      recruitee: subdomain, or the company's own careers domain (meet.zoi.tech)
#
# Add more:   python detect_ats.py "Company" https://company.com/careers
# Test all:   python run.py --check
#
# Every entry below was found on a live careers URL in Oct 2026. Greenhouse,
# Lever, Ashby and SmartRecruiters feeds were tested live; Personio feeds can
# be switched off by the company - run --check once and delete any that fail.

